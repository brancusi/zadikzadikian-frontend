<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px 32px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{height:96px}.tok{font-family:var(--font-grotesque);font-size:11px;color:var(--text-meta);margin-top:6px}
.hex{font-family:var(--font-grotesque);font-size:11px;color:var(--text-display)}</style></head>
<body>
<div class="g">
<div><div class="sw" style="background:var(--gold)"></div><div class="tok">--gold · accent</div><div class="hex">#A8842C</div></div>
<div><div class="sw" style="background:var(--gold-deep)"></div><div class="tok">--gold-deep · press states</div><div class="hex">#7E611C</div></div>
<div><div class="sw" style="background:var(--gold-leaf)"></div><div class="tok">--gold-leaf · ceremonial gradient</div><div class="hex">135° leaf</div></div>
</div>
<div style="margin-top:14px;font-family:var(--font-serif-text);font-size:15px">Links turn <a href="#">gold on hover</a>; gold never fills a background.</div>
</body></html>
