<!-- @dsCard group="Colors" viewport="700x230" name="Gallery neutrals" subtitle="Warm paper, near-black ink — the page is a primed wall" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px 32px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{height:96px;border:1px solid var(--rule)}.tok{font-family:var(--font-grotesque);font-size:11px;color:var(--text-meta);margin-top:6px}
.hex{font-family:var(--font-grotesque);font-size:11px;color:var(--text-display)}</style></head>
<body>
<div class="g">
<div><div class="sw" style="background:var(--paper)"></div><div class="tok">--paper</div><div class="hex">#FBFAF6</div></div>
<div><div class="sw" style="background:var(--paper-warm)"></div><div class="tok">--paper-warm</div><div class="hex">#F4F1E9</div></div>
<div><div class="sw" style="background:var(--ink-2)"></div><div class="tok">--ink-2</div><div class="hex">#494640</div></div>
<div><div class="sw" style="background:var(--ink)"></div><div class="tok">--ink</div><div class="hex">#161512</div></div>
</div>
</body></html>
