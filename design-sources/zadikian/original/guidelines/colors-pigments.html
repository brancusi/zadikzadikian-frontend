<!-- @dsCard group="Colors" viewport="700x250" name="Pigment primaries" subtitle="Drawn from the cast works — index marks only, never backgrounds; max one per spread" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px 32px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{height:110px}.tok{font-family:var(--font-grotesque);font-size:11px;color:var(--text-meta);margin-top:6px}
.hex{font-family:var(--font-grotesque);font-size:11px;color:var(--text-display)}</style></head>
<body>
<div class="g">
<div><div class="sw" style="background:var(--pigment-cadmium)"></div><div class="tok">--pigment-cadmium</div><div class="hex">#E63329</div></div>
<div><div class="sw" style="background:var(--pigment-chrome)"></div><div class="tok">--pigment-chrome</div><div class="hex">#F2C400</div></div>
<div><div class="sw" style="background:var(--pigment-ultramarine)"></div><div class="tok">--pigment-ultramarine</div><div class="hex">#1F5FB4</div></div>
<div><div class="sw" style="background:var(--pigment-turquoise)"></div><div class="tok">--pigment-turquoise</div><div class="hex">#35AEB2</div></div>
<div><div class="sw" style="background:var(--pigment-magenta)"></div><div class="tok">--pigment-magenta</div><div class="hex">#E23A77</div></div>
</div>
</body></html>
