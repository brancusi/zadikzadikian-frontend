<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

.m{position:absolute;inset:28px 56px;border:1px dashed var(--gold)}

<body>
<div class="page">
<div class="m"></div>
<div class="lab" style="position:absolute;top:8px;left:56px">--page-margin</div>
<div style="position:absolute;top:48px;left:80px;font-family:var(--font-serif-display);font-size:34px;color:var(--text-display)">One dominant axis</div>
<div style="position:absolute;top:104px;left:80px;width:300px;font-family:var(--font-serif-text);font-size:12px;line-height:1.6;color:var(--text-body)">Asymmetric grids; content sits on the left axis, metadata on the right. The rest is left empty — the page behaves like the gallery around a plinth.</div>
<div style="position:absolute;top:104px;right:80px;font-family:var(--font-grotesque);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-meta)">Provenance<br><br>Edition<br><br>Dimensions</div>
</div>
