<!DOCTYPE html>

<style>body{padding:24px 32px}.row{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:16px;padding:4px 0}

<div class="row"><span class="tok">--space-6 · 32</span><div class="bar" style="width:32px"></div></div>

<div class="row"><span class="tok">--space-9 · 96</span><div class="bar" style="width:96px"></div></div>
<div class="row"><span class="tok">--space-10 · 128</span><div class="bar" style="width:128px"></div></div>
<div class="row"><span class="tok">--space-11 · 176</span><div class="bar" style="width:176px"></div></div>

</body></html>
