<!-- @dsCard group="Type" viewport="700x330" name="Type scale" subtitle="Seven steps; jumps are large and deliberate" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px 32px}.row{display:grid;grid-template-columns:150px 1fr;align-items:baseline;gap:20px;border-bottom:1px solid var(--rule);padding:7px 0}
.tok{font-family:var(--font-grotesque);font-size:11px;color:var(--text-meta)}</style></head>
<body>
<div class="row"><span class="tok">--text-display · 64</span><span style="font-family:var(--font-serif-display);font-size:64px;line-height:1;color:var(--text-display)">Return</span></div>
<div class="row"><span class="tok">--text-headline · 40</span><span style="font-family:var(--font-serif-display);font-size:40px;line-height:1.1;color:var(--text-display)">Return</span></div>
<div class="row"><span class="tok">--text-title · 28</span><span style="font-family:var(--font-serif-display);font-size:28px;color:var(--text-display)">Return</span></div>
<div class="row"><span class="tok">--text-lede · 21</span><span style="font-family:var(--font-serif-text);font-size:21px;color:var(--text-display)">Return</span></div>
<div class="row"><span class="tok">--text-body · 17</span><span style="font-family:var(--font-serif-text);font-size:17px">Return</span></div>
<div class="row"><span class="tok">--text-meta · 13</span><span style="font-family:var(--font-grotesque);font-size:13px;color:var(--text-meta)">Return</span></div>
<div class="row" style="border-bottom:none"><span class="tok">--text-caption · 11</span><span style="font-family:var(--font-grotesque);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-meta)">Return</span></div>
</body></html>
