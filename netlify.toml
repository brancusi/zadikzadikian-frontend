[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.18.0"
  PNPM_VERSION = "11.18.0"

# Exact one-hop migrations only. Conditional/omitted legacy content is never sent to Home.
[[redirects]]
  from = "/bio"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/resume"
  to = "/cv/"
  status = 301

[[redirects]]
  from = "/path-to-nine-work"
  to = "/work/path-to-nine/"
  status = 301

[[redirects]]
  from = "/work/gold-stacks"
  to = "/work/stacks/"
  status = 301

[[redirects]]
  from = "/solis"
  to = "/work/solis/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; media-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/fixtures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
